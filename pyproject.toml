[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e2d2"
version = "0.1.0"
description = "Encoder-decoder diffusion language models and speculative decoding experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.11.0",
  "datasets==4.2.0",
  "einops==0.8.1",
  "evaluate==0.4.6",
  "fsspec==2025.9.0",
  "huggingface-hub==0.36.0",
  "hydra-core==1.3.2",
  "lm-eval==0.4.9",
  "matplotlib==3.10.7",
  "mosaicml==0.32.1",
  "mosaicml-streaming==0.13.0",
  "numpy==2.1.3",
  "omegaconf==2.3.0",
  "pandas==2.3.3",
  "peft==0.17.1",
  "pyyaml==6.0.2",
  "regex==2025.11.3",
  "rich==13.9.4",
  "sacrebleu==2.5.1",
  "safetensors==0.6.2",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "sentencepiece==0.2.1",
  "tokenizers==0.21.4",
  "torch==2.7.0",
  "torchmetrics==1.7.4",
  "torchvision==0.22.0",
  "tqdm==4.67.1",
  "transformers==4.52.4",
  "wandb==0.22.2",
  "word2number==1.1",
]

[dependency-groups]
dev = [
  "pre-commit==4.3.0",
  "pytest==8.3.4",
  "ruff==0.14.3",
]
notebooks = [
  "ipykernel>=6.30,<7",
  "jupyter>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I"]

[tool.black]
line-length = 88
target-version = ["py312"]
