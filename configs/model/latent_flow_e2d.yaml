defaults:
  - base@_here_
  - _self_

_target_: src.denoiser.latent_flow.LatentFlowE2D
config:
  _target_: src.denoiser.latent_flow.LatentFlowE2DConfig
  block_size: ${block_size}
  eval_block_size: ${eval_block_size}
  draft_layer_offsets: [-3, -2]
  target_layer_offset: -1
  inference_steps: 1
  # Dataset statistics shaped [hidden_size], averaged over examples and valid
  # sequence positions. Recompute when changing the backbone, layer, or dataset.
  latent_stats_path: ${cwd:}/outputs/diagnostics/qwen-latent-norms/normalization_stats.pt
  prediction_type: velocity  # velocity | x0
  adaptive_timestep_sampling: false
  adaptive_num_bins: 50
  adaptive_ema_decay: 0.99
  adaptive_uniform_mix: 0.2
  adaptive_min_observations: 100
  fixed_training_noise: false
  fixed_training_seed: 17
