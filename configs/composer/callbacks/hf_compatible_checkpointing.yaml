hf_compatible_checkpointing:
  _target_: src.custom_composer.callbacks.HuggingFaceCompatibleCheckpointing
  folder: ${composer.trainer.save_folder}
  filename: ${composer.trainer.save_filename}
  latest_filename: ${composer.trainer.save_latest_filename}
  save_interval: ${composer.trainer.save_interval}
  num_checkpoints_to_keep: ${composer.trainer.save_num_checkpoints_to_keep}
  overwrite: ${composer.trainer.save_overwrite}
  disable_hf: false
  save_local: true
  # Checkpoints are local-only unless a launcher explicitly opts into a Hub push.
  # The previous project-namespace default caused unrelated users' runs to fail
  # at checkpoint time with a 403 after otherwise successful training.
  save_to_hub: false
  hub_repo_id: null
